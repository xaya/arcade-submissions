name: Game submission
description: Request a new game listing or update with one exact source commit.
title: "[game] Game title"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Submit the version you tested. We review its source, rebuild it and test it privately before listing it.
        You do not need to run an arcade server. For an update, link the earlier issue in Notes.
  - type: input
    id: repository
    attributes:
      label: Game repository URL
      description: Must contain the frontend, rules source, compiled WASM, its SHA-256 file, and build/test instructions. If private, arrange reviewer access.
      placeholder: https://github.com/your-account/your-game
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Full commit hash
      description: The pushed commit containing the frontend and WASM rules you tested. Use the full hash, not a branch or tag.
    validations:
      required: true
  - type: input
    id: gametitle
    attributes:
      label: Game title
    validations:
      required: true
  - type: textarea
    id: game_details
    attributes:
      label: Description and controls
      description: Explain the objective, how to play, and supported devices. You can include a screenshot.
    validations:
      required: true
  - type: textarea
    id: registration
    attributes:
      label: Registration details
      description: Slug is the proposed URL name. Game type is GAME_KEY in the template. cfgSuffix is the hex rules configuration, or none. Player counts must match your rules.
      value: |
        Slug:
        Game type:
        Player counts (minimum..maximum):
        cfgSuffix:
    validations:
      required: true
  - type: input
    id: blobpath
    attributes:
      label: WASM file path
      description: Path inside the repository at the submitted commit. Include its .sha256 file alongside it.
      value: blob/rules.wasm
    validations:
      required: true
  - type: input
    id: blobsha
    attributes:
      label: WASM SHA-256
      description: The hash of the compiled WASM at that commit. We rebuild the rules and check it matches. No frontend bundle hash is required.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test results
      description: Paste summaries for the commands below, or document equivalent checks in your repository. State which player counts and devices you tested and any gaps. A hosted playground run is optional.
      placeholder: |
        bash blob/check-blob.sh --rebuild --strict
        bash blob/tests/run-tests.sh
        npm test
        npm run e2e
        npm run e2e:determinism
        Player counts and devices tested:
        Known issues or checks not run:
    validations:
      required: true
  - type: dropdown
    id: wagering
    attributes:
      label: Request WCHI wagering?
      description: Free play is required. Wagering needs separate approval.
      options: ["No", "Yes"]
    validations:
      required: true
  - type: dropdown
    id: touch
    attributes:
      label: Touch controls supported?
      description: Does the game have tested touch controls? If No, describe the limitation in Notes for review.
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes or update details
      description: For updates, link the previous issue and describe what changed. Include any build requirements or source dependencies reviewers need.
